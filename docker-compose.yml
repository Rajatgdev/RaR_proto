# Local Postgres for dev only. Neon is used in deploy.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling_dev
      POSTGRES_DB: scheduling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
